name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip mod files
      run: |
        unzip -o funcionarios-mod.zip -d extracted_mod

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./extracted_mod

    - name: Build with Gradle
      run: ./gradlew build
      working-directory: ./extracted_mod

    - name: Upload artifact (.jar)
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: extracted_mod/build/libs/*.jar
